name: Performance benchmark

on:
  push:
    branches:
      - perf/local-workflow
  workflow_dispatch:
    inputs:
      local_workflow:
        description: Benchmark simultaneous developer requests
        required: true
        default: false
        type: boolean
      candidate_ref:
        description: Candidate git ref
        required: true
        default: HEAD
        type: string
      baseline_ref:
        description: Baseline git ref
        required: true
        default: HEAD^
        type: string
      workload:
        description: Workload
        required: true
        default: small
        type: choice
        options:
          - small
          - large
      scenario:
        description: Scenario
        required: true
        default: goanalysis
        type: choice
        options:
          - goanalysis
          - configured
          - configured-new
          - govet
          - staticcheck
          - unused
          - staticcheck-unused
      cache_mode:
        description: Cache state before each timed run
        required: true
        default: cold
        type: choice
        options:
          - cold
          - warm
          - edit
          - cold,warm
      capture_profiles:
        description: Capture CPU, heap, and trace profiles
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: performance-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'smykla-skalski/golt' && github.event_name == 'workflow_dispatch' && !inputs.local_workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOMAXPROCS: 2
      GOMEMLIMIT: 1024MiB
      GOFLAGS: -p=2
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      BASELINE_REF: ${{ inputs.baseline_ref }}
      WORKLOAD: ${{ inputs.workload }}
      SCENARIO: ${{ inputs.scenario }}
      CACHE_MODE: ${{ inputs.cache_mode }}
      CAPTURE_PROFILES: ${{ inputs.capture_profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
          cache: false

      - name: Build candidate and baseline
        run: |
          go run ./scripts/bench/build_pair \
            --candidate-ref "$CANDIDATE_REF" \
            --upstream-ref "$BASELINE_REF" \
            --baseline-mode exact \
            --out-dir dist/bench/bin \
            --build-timeout 5m \
            --max-memory-mib 1024 \
            --go-max-procs 2 \
            --nice 10

      - name: Benchmark both binary orders
        shell: bash
        run: |
          profile_args=()
          if [[ "$CAPTURE_PROFILES" == "true" ]]; then
            profile_args+=(--profiles)
          fi

          common_args=(
            --manifest scripts/bench/baseline.json
            --workload "$WORKLOAD"
            --scenario "$SCENARIO"
            --concurrency 2
            --profile-concurrency 2
            --cache-mode "$CACHE_MODE"
            --runs 7
            --run-timeout 2m
            --max-rss-mib 1024
            --go-max-procs 2
            --nice 10
          )

          go run ./scripts/bench/baseline \
            --fork-bin dist/bench/bin/fork \
            --upstream-bin dist/bench/bin/upstream \
            --out dist/bench/hosted/candidate-first \
            "${common_args[@]}" "${profile_args[@]}"

          go run ./scripts/bench/baseline \
            --fork-bin dist/bench/bin/fork \
            --upstream-bin dist/bench/bin/upstream \
            --binary-order upstream-first \
            --out dist/bench/hosted/baseline-first \
            "${common_args[@]}"

      - name: Summarize results
        if: always()
        run: |
          {
            echo "## ${WORKLOAD} / ${SCENARIO} (${CACHE_MODE})"
            echo
            echo "Candidate \`${CANDIDATE_REF}\` vs baseline \`${BASELINE_REF}\`."
            echo
            go run ./scripts/bench/summary dist/bench/hosted
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ inputs.workload }}-${{ inputs.scenario }}-${{ inputs.cache_mode == 'cold,warm' && 'cold-warm' || inputs.cache_mode }}
          path: |
            dist/bench/bin/pair.json
            dist/bench/hosted
            !dist/bench/hosted/**/workloads/**
            !dist/bench/hosted/**/cache/**
          if-no-files-found: error
          retention-days: 14

  local-workflow:
    if: github.repository == 'smykla-skalski/golt' && (github.event_name == 'push' || inputs.local_workflow)
    name: local-workflow (${{ matrix.workload }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workload: [small, large]
    env:
      GOLT_WORKFLOW_PACKAGES: ${{ matrix.workload == 'large' && './api/...' || './...' }}
      GOLT_WORKFLOW_TESTS: ${{ matrix.workload == 'large' && 'false' || 'true' }}
      GOLT_WORKFLOW_MEMORY_LIMIT: ${{ matrix.workload == 'large' && '768MiB' || '512MiB' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
          cache: false

      - name: Build linter
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 1024MiB
          GOFLAGS: -p=2
        run: |
          mkdir -p dist/bench
          go build -o dist/bench/golangci-lint ./cmd/golangci-lint

      - name: Prepare pinned workload
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          if [[ "$WORKLOAD" == "large" ]]; then
            git clone --filter=blob:none https://github.com/kumahq/kuma.git dist/bench/workload
            git -C dist/bench/workload checkout --detach 12fbf5f561e00b5f71eb5e72dc82e1a9eb4f9e87
          else
            git clone --filter=blob:none https://github.com/Automaat/cache-buster.git dist/bench/workload
            git -C dist/bench/workload checkout --detach 1ed2641a75cb424a592fa3eddf76da32180e7ed4
          fi

      - name: Benchmark editor requests
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -o pipefail
          if [[ "$WORKLOAD" == "large" ]]; then
            repetitions=2
          else
            repetitions=3
          fi
          python3 scripts/bench/local_workflow.py \
            --binary dist/bench/golangci-lint \
            --workdir dist/bench/workload \
            --out dist/bench/local-workflow \
            --profile "$WORKLOAD" \
            --repetitions "$repetitions" | tee dist/bench/local-workflow-summary.md
          cat dist/bench/local-workflow-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report public measurements
        run: python3 scripts/bench/report_local_workflow.py dist/bench/local-workflow/results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-workflow-${{ matrix.workload }}
          path: |
            dist/bench/local-workflow
            dist/bench/local-workflow-summary.md
          if-no-files-found: warn
          retention-days: 14
