name: Kuma make check lint benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile one edited golt run instead of timing pairs
        type: boolean
        default: false
      baseline_ref:
        description: Baseline git ref (default is upstream v2.14.0)
        type: string
        default: refs/tags/benchmark-upstream

permissions:
  contents: read

concurrency:
  group: kuma-make-check-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'smykla-skalski/golt'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Build upstream and golt
        env:
          BASELINE_REF: ${{ inputs.baseline_ref || 'refs/tags/benchmark-upstream' }}
        run: |
          git fetch --no-tags https://github.com/golangci/golangci-lint.git \
            refs/tags/v2.14.0:refs/tags/benchmark-upstream
          go run ./scripts/bench/build_pair \
            --candidate-ref HEAD \
            --upstream-ref "$BASELINE_REF" \
            --baseline-mode exact \
            --out-dir dist/bench/bin \
            --build-timeout 15m \
            --max-memory-mib 4096 \
            --go-max-procs 4 \
            --nice 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kuma-make-check-binaries
          path: dist/bench/bin
          if-no-files-found: error
          retention-days: 1

  compare:
    if: ${{ !inputs.profile }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        order: [upstream-first, golt-first]
    name: Local lint (${{ matrix.order }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kuma-make-check-binaries
          path: dist/bench/bin
      - name: Prepare pinned Kuma checkout
        run: |
          chmod +x dist/bench/bin/fork dist/bench/bin/upstream
          git clone --filter=blob:none --no-checkout \
            https://github.com/kumahq/kuma.git dist/bench/workload
          git -C dist/bench/workload fetch --depth=1 origin \
            c993a12399b6b19dcc66c515208fdba6af1c45e5
          git -C dist/bench/workload checkout --detach \
            c993a12399b6b19dcc66c515208fdba6af1c45e5
      - name: Compare local make-check lint command
        env:
          ORDER: ${{ matrix.order }}
        run: |
          python3 scripts/bench/kuma_make_check.py \
            --upstream-bin dist/bench/bin/upstream \
            --golt-bin dist/bench/bin/fork \
            --workdir dist/bench/workload \
            --out dist/bench/make-check \
            --order "$ORDER"
          cat dist/bench/make-check/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kuma-make-check-${{ matrix.order }}
          path: |
            dist/bench/bin/pair.json
            dist/bench/make-check/*.json
            dist/bench/make-check/*.md
            dist/bench/make-check/*.stdout
            dist/bench/make-check/*.stderr
          if-no-files-found: warn
          retention-days: 30

  profile:
    if: ${{ inputs.profile }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kuma-make-check-binaries
          path: dist/bench/bin
      - name: Prepare pinned Kuma checkout
        run: |
          chmod +x dist/bench/bin/fork
          git clone --filter=blob:none --no-checkout \
            https://github.com/kumahq/kuma.git dist/bench/workload
          git -C dist/bench/workload fetch --depth=1 origin \
            c993a12399b6b19dcc66c515208fdba6af1c45e5
          git -C dist/bench/workload checkout --detach \
            c993a12399b6b19dcc66c515208fdba6af1c45e5
      - name: Profile edited local lint command
        run: |
          set -euo pipefail
          unset GOGC GOMAXPROCS GOFLAGS
          mkdir -p dist/bench/make-check-profile/cache dist/bench/make-check-profile/output
          binary="$GITHUB_WORKSPACE/dist/bench/bin/fork"
          output="$GITHUB_WORKSPACE/dist/bench/make-check-profile/output"
          cache="$GITHUB_WORKSPACE/dist/bench/make-check-profile/cache"
          cd dist/bench/workload
          CGO_ENABLED=0 GOMEMLIMIT=7GiB GOLANGCI_LINT_CACHE="$cache" \
            "$binary" run --timeout=10m -v > "$output/seed.stdout" 2> "$output/seed.stderr"
          printf '\n// make-check profile edit\n' >> api/system/v1alpha1/datasource_helpers.go
          CGO_ENABLED=0 GOMEMLIMIT=7GiB GOLANGCI_LINT_CACHE="$cache" \
            GOLANGCI_LIFECYCLE_REPORT="$output/lifecycle.json" \
            "$binary" run --timeout=10m -v \
              --cpu-profile-path="$output/edited.cpu.pprof" \
              > "$output/edited.stdout" 2> "$output/edited.stderr"
          go tool pprof -top -cum -nodecount=35 "$binary" "$output/edited.cpu.pprof" \
            > "$output/cpu-top.txt"
          cat "$output/cpu-top.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kuma-make-check-profile
          path: dist/bench/make-check-profile/output
          if-no-files-found: warn
          retention-days: 30
