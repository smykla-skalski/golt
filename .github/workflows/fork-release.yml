name: Fork release
on:
  push:
    tags:
      - 'v*-golt.*'
  pull_request:
  schedule:
    # Upstream syncs bump requirements without triggering PR workflows.
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions: {}

env:
  GO_VERSION: '1.27.0'

jobs:
  # Each replaced module must patch exactly the version upstream requires,
  # otherwise an upstream bump is silently shadowed by an older fork.
  fork-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check forks match required versions
        run: |
          status=0
          while read -r path base dir _; do
            actual="$(go list -m -f '{{.Version}} {{with .Replace}}{{.Path}}{{end}}' "${path}")"
            if [[ "${actual}" == "${base} ./${dir}" ]]; then
              echo "ok: ${path} ${base} => ./${dir}"
            else
              echo "::error::${path} is '${actual}' but ${dir} is based on ${base}; rebase ${dir} (see forks/README.md)"
              status=1
            fi
          done < forks/UPSTREAM
          exit "${status}"

  release:
    if: github.repository == 'smykla-skalski/golt' && startsWith(github.ref, 'refs/tags/')
    needs: fork-deps
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Create release
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --config .goreleaser.golt.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/golangci-lint-${{ fromJSON(steps.goreleaser.outputs.metadata).version }}-checksums.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
