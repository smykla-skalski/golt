name: Agentic benchmark

on:
  push:
    branches:
      - perf/agentic-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  multi-repo:
    if: github.repository == 'smykla-skalski/golt'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Build linter
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 1024MiB
          GOFLAGS: -p=2
        run: |
          mkdir -p dist/bench
          go build -o dist/bench/golangci-lint ./cmd/golangci-lint

      - name: Prepare pinned worktrees
        run: |
          git clone --filter=blob:none https://github.com/Automaat/cache-buster.git dist/bench/small-a
          git -C dist/bench/small-a checkout --detach 1ed2641a75cb424a592fa3eddf76da32180e7ed4
          git clone --local dist/bench/small-a dist/bench/small-b
          git clone --filter=blob:none https://github.com/kumahq/kuma.git dist/bench/kuma-a
          git -C dist/bench/kuma-a checkout --detach 12fbf5f561e00b5f71eb5e72dc82e1a9eb4f9e87
          git clone --local dist/bench/kuma-a dist/bench/kuma-b

      - name: Compare multi-repo policies
        run: |
          python3 scripts/bench/agentic_ci.py \
            --binary dist/bench/golangci-lint \
            --small dist/bench/small-a \
            --small-copy dist/bench/small-b \
            --kuma dist/bench/kuma-a \
            --kuma-copy dist/bench/kuma-b \
            --out dist/bench/agentic \
            --repetitions 2
          cat dist/bench/agentic/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentic-benchmark
          path: |
            dist/bench/agentic/*.json
            dist/bench/agentic/*.md
            dist/bench/agentic/*.stdout
            dist/bench/agentic/*.stderr
          if-no-files-found: warn
          retention-days: 14
