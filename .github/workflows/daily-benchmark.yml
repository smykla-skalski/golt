name: Daily benchmark vs upstream

on:
  schedule:
    # After the upstream sync, so golt and upstream share the same base.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-benchmark
  cancel-in-progress: false

env:
  # Wall-time regression, in percent, that fails the run.
  MAX_WALL_REGRESSION: '5'

jobs:
  benchmark:
    if: github.repository == 'smykla-skalski/golt'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOMAXPROCS: 2
      GOMEMLIMIT: 1024MiB
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
          cache: false

      - name: Build golt and upstream
        run: |
          git fetch --no-tags https://github.com/golangci/golangci-lint.git main:refs/remotes/upstream/main
          go run ./scripts/bench/build_pair \
            --candidate-ref HEAD \
            --upstream-ref upstream/main \
            --baseline-mode exact \
            --out-dir dist/bench/bin \
            --build-timeout 5m \
            --max-memory-mib 1024 \
            --go-max-procs 2 \
            --nice 10

      - name: Benchmark scenarios
        shell: bash
        run: |
          scenarios=(
            "large goanalysis cold"
            "large configured warm"
            "large configured-new edit"
          )
          {
            echo "## golt vs upstream golangci-lint"
            echo
            echo "golt \`$(git rev-parse --short HEAD)\` vs upstream \`$(git rev-parse --short upstream/main)\`; 2 CPUs, 1 GiB, 7 runs per binary per order."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for entry in "${scenarios[@]}"; do
            read -r workload scenario mode <<< "${entry}"
            out="dist/bench/daily/${workload}-${scenario}-${mode}"
            common_args=(
              --manifest scripts/bench/baseline.json
              --workload "${workload}"
              --scenario "${scenario}"
              --concurrency 2
              --cache-mode "${mode}"
              --runs 7
              --run-timeout 2m
              --max-rss-mib 1024
              --go-max-procs 2
              --nice 10
            )
            if ! go run ./scripts/bench/baseline --fork-bin dist/bench/bin/fork --upstream-bin dist/bench/bin/upstream \
                --out "${out}/candidate-first" "${common_args[@]}" ||
              ! go run ./scripts/bench/baseline --fork-bin dist/bench/bin/fork --upstream-bin dist/bench/bin/upstream \
                --binary-order upstream-first --out "${out}/baseline-first" "${common_args[@]}"; then
              echo "::error::${workload}/${scenario}/${mode} benchmark failed"
              status=1
              continue
            fi

            echo "### ${workload} / ${scenario} (${mode})" >> "$GITHUB_STEP_SUMMARY"
            if ! go run ./scripts/bench/summary -max-wall-regression "${MAX_WALL_REGRESSION}" "${out}" >> "$GITHUB_STEP_SUMMARY"; then
              echo "::error::${workload}/${scenario}/${mode}: golt is slower than upstream beyond ${MAX_WALL_REGRESSION}%"
              status=1
            fi
          done
          exit "${status}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-benchmark
          path: |
            dist/bench/bin/pair.json
            dist/bench/daily
            !dist/bench/daily/**/workloads/**
            !dist/bench/daily/**/cache/**
          if-no-files-found: error
          retention-days: 90
