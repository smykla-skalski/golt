name: Forks
on:
  push:
    branches:
      - main
    paths:
      - 'forks/**'
      - '.github/workflows/forks.yml'
  pull_request:
    paths:
      - 'forks/**'
      - '.github/workflows/forks.yml'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'

jobs:
  test:
    name: test ${{ matrix.fork.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fork:
          - dir: forks/tools
            packages: ./go/ssa/... ./go/packages/... ./go/callgraph/... ./go/analysis/passes/buildssa/... ./go/analysis/passes/nilness/...
          - dir: forks/go-tools
            packages: ./...
          - dir: forks/revgrep
            packages: ./...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run tests
        working-directory: ${{ matrix.fork.dir }}
        env:
          PACKAGES: ${{ matrix.fork.packages }}
          GOFLAGS: -p=2
        run: |
          read -r -a packages <<< "${PACKAGES}"
          go test "${packages[@]}"
