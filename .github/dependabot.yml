# golt takes golangci-lint's dependencies through the daily upstream sync, and Renovate
# keeps the files golt adds. A limit of zero keeps Dependabot from opening version updates.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
