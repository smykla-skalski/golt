version: 2

# golt release: GitHub assets only, named like upstream so
# installers keyed on "<name>-<version>-<os>-<arch>" keep working.
project_name: golangci-lint

builds:
  - binary: golangci-lint
    main: ./cmd/golangci-lint/
    flags:
      - -trimpath
    ldflags: -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [ 'tar.gz' ]
    wrap_in_directory: true
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: '{{ .ProjectName }}-{{ .Version }}-checksums.txt'

changelog:
  use: github-native

release:
  github:
    owner: smykla-skalski
    name: golt
  # Fork tags are semver pre-releases (vX.Y.Z-golt.N); installers skip
  # pre-releases when resolving "latest".
  prerelease: 'false'
  make_latest: 'true'
  header: |
    golt {{ .Tag }}: golangci-lint built against the patched
    `golang.org/x/tools`, `honnef.co/go/tools` and revgrep in `forks/`.
